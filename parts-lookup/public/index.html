<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parts Lookup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Parts Lookup</h1>
    <p class="subtitle">Photograph a part. Get its manufacturer part number and supplier availability.</p>

    <div class="capture">
      <input id="photo-input" type="file" accept="image/*" capture="environment" />
      <img id="preview" alt="Selected part photo" hidden />
      <button id="identify-btn" disabled>Identify part</button>
    </div>

    <div id="status" class="status" hidden></div>

    <div id="results" class="results" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
